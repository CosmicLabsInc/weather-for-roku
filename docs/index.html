<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Weather for Roku</title>
  <style>
    :root { color-scheme: dark; }
    body {
      margin: 0; padding: 0;
      background: linear-gradient(180deg, #0a1424 0%, #16233f 100%);
      color: #e2e8f0;
      font-family: -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif;
      line-height: 1.65;
      min-height: 100vh;
    }
    main { max-width: 720px; margin: 0 auto; padding: 72px 24px 80px; text-align: center; }
    h1 { color: #f8fafc; font-size: 2.4rem; margin: 0 0 6px; }
    .tagline { color: #94a3b8; font-size: 1.1rem; margin-bottom: 40px; }
    .links { display: flex; flex-direction: column; gap: 14px; max-width: 340px; margin: 0 auto; }
    .links a {
      display: block; padding: 14px 18px; border-radius: 12px;
      background: rgba(125, 211, 252, 0.08);
      border: 1px solid rgba(125, 211, 252, 0.25);
      color: #7dd3fc; text-decoration: none; font-weight: 600;
    }
    .links a:hover { background: rgba(125, 211, 252, 0.16); }
    footer { color: #64748b; font-size: 0.85rem; margin-top: 48px; }
    footer a { color: #64748b; }
  </style>
</head>
<body>
  <main>
    <h1>Weather for Roku</h1>
    <p class="tagline">A simple, beautiful 7-day forecast.</p>

    <div class="links">
      <a href="privacy.html">Privacy Policy</a>
      <a href="terms.html">Terms of Use</a>
      <a href="https://github.com/aCosmicWave/weather-for-roku" target="_blank" rel="noopener">Source on GitHub</a>
    </div>

    <footer>
      Questions? <a href="mailto:weatherforroku@gmail.com">weatherforroku@gmail.com</a>
    </footer>
  </main>
</body>
</html>
